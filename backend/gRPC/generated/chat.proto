syntax = "proto3";

package chat;

service Chat {
  rpc Answer (QuestionRequest) returns (AnswerResponse);
}

message HistoryList {
  string role = 1;
  string content = 2;
}

message QuestionRequest {
  string query = 1;
  repeated HistoryList history = 2;
}

message AnswerResponse {
  bool isSuccess = 1; 
  string answer = 2;
  repeated string related_questions = 3;
  repeated string keywords = 4;
}