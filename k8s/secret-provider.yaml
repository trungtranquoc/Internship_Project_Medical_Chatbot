apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: medical-secrets-provider
  namespace: medical-chatbot
spec:
  provider: aws
  secretObjects:
  - secretName: medical-secrets
    type: Opaque
    data:
    - objectName: "OPENAI_API_KEY"
      key: OPENAI_API_KEY
    - objectName: "POSTGRES_PASSWORD"
      key: POSTGRES_PASSWORD
    - objectName: "POSTGRES_USER"
      key: POSTGRES_USER
    - objectName: "CHAINLIT_AUTH_SECRET"
      key: CHAINLIT_AUTH_SECRET
    - objectName: "LANGFUSE_SECRET_KEY"
      key: LANGFUSE_SECRET_KEY
    - objectName: "LANGFUSE_PUBLIC_KEY"
      key: LANGFUSE_PUBLIC_KEY
    - objectName: "LANGFUSE_BASE_URL"
      key: LANGFUSE_BASE_URL
  parameters:
    objects: |
      - objectName: "medical-chatbot/app-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: "OPENAI_API_KEY"
            objectAlias: "OPENAI_API_KEY"
          - path: "CHAINLIT_AUTH_SECRET"
            objectAlias: "CHAINLIT_AUTH_SECRET"
          - path: "LANGFUSE_SECRET_KEY"
            objectAlias: "LANGFUSE_SECRET_KEY"
          - path: "LANGFUSE_PUBLIC_KEY"
            objectAlias: "LANGFUSE_PUBLIC_KEY"
          - path: "LANGFUSE_BASE_URL"
            objectAlias: "LANGFUSE_BASE_URL"
      - objectName: "rds!db-424649ea-d988-48f3-8364-8fdda0577608"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "POSTGRES_PASSWORD"
          - path: "username"
            objectAlias: "POSTGRES_USER"