apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: medical-chatbot-ui:latest
        ports:
        - containerPort: 8000
        env:
        - name: BACKEND_HOST
          value: "medical-backend-service"
        - name: BACKEND_PORT
          value: "8001"
---
apiVersion: v1
kind: Service
metadata:
  name: medical-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000