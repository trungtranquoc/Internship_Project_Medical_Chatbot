apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      serviceAccountName: milvus-s3-sa
      containers:
      - name: chatbot
        image: 376276261088.dkr.ecr.us-east-1.amazonaws.com/medical-chatbot/inference:latest@sha256:28eccb1ed406cd7383e32c46907dc7b4c2404a3bf9d5ce8b6e9f6c53aee354aa
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: medical-secrets
              key: OPENAI_API_KEY
        - name: MILVUS_HOST
          valueFrom:
            configMapKeyRef:
              name: medical-chatbot-config
              key: MILVUS_HOST
        - name: MILVUS_PORT
          valueFrom:
            configMapKeyRef:
              name: medical-chatbot-config
              key: MILVUS_PORT
        - name: MILVUS_COLLECTION
          valueFrom:
            configMapKeyRef:
              name: medical-chatbot-config
              key: MILVUS_COLLECTION
        - name: LANGFUSE_AVAILABLE
          valueFrom:
            configMapKeyRef:
              name: medical-chatbot-config
              key: LANGFUSE_AVAILABLE
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: medical-secrets
              key: LANGFUSE_SECRET_KEY
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: medical-secrets
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_HOST
          valueFrom:
            secretKeyRef:
              name: medical-secrets
              key: LANGFUSE_BASE_URL
        - name: RERANKER_MODEL
          valueFrom:
            configMapKeyRef:
              name: medical-chatbot-config
              key: RERANKER_MODEL
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "medical-secrets-provider"
              
---
apiVersion: v1
kind: Service
metadata:
  name: medical-chatbot-service
spec:
  selector:
    app: chatbot
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051